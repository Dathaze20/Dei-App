name: Android release APK (manual)

# Builds the signed DeliOrderNYC APK from `main`. Runs ONLY when the owner presses "Run workflow";
# never on push, pull request or schedule. See docs/ANDROID.md.
#
# - Without "create_draft_release" it only builds, verifies and uploads the APK as a workflow
#   artifact (kept 14 days) for review.
# - With it, the APK is attached to a DRAFT GitHub Release. Drafts are invisible to the in-app
#   updater. Nothing reaches the phone until the owner opens the draft and presses
#   "Publish release" on GitHub.
# - With "publish_approved_release", an APK the owner has approved is published as the latest
#   stable release, which the in-app updater then offers. It needs the approved commit and
#   version typed in; it publishes only if they match what was built and every check passed.
#   A push, pull request or merge never publishes anything.
#
# Signing uses repository secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD, and the
# repository variable ANDROID_SIGNING_CERT_SHA256 (the key's fingerprint). If any is missing the
# run stops: it never creates or uses another key.
on:
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: 'Also attach the APK to a draft GitHub Release (publish it yourself afterwards)'
        type: boolean
        default: false
      release_notes:
        description: 'Release notes shown in the app (plain text)'
        type: string
        default: ''
      publish_approved_release:
        description: 'PUBLISH this approved release as the latest (the app will offer it)'
        type: boolean
        default: false
      approved_version:
        description: 'Publishing only: the approved version, e.g. 0.1.4 (must equal package.json)'
        type: string
        default: ''
      approved_commit:
        description: 'Publishing only: the approved main commit (at least 7 characters)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify the signed APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Exactly the commit this run was started on (the tip of main at that moment), so a later
      # push to main can never slip into a build that was approved for another commit.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Check the publishing request
        if: inputs.publish_approved_release
        env:
          APPROVED_VERSION: ${{ inputs.approved_version }}
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          version="$(node -p "require('./package.json').version")"
          [ -n "$APPROVED_VERSION" ] || fail "Publishing needs approved_version (for example $version)."
          [ "${APPROVED_VERSION#v}" = "$version" ] || fail "approved_version $APPROVED_VERSION is not the version on main ($version). Nothing was built."
          commit="$(printf '%s' "$APPROVED_COMMIT" | tr 'A-F' 'a-f' | tr -d ' ')"
          printf '%s' "$commit" | grep -Eqx '[0-9a-f]{7,40}' || fail "approved_commit must be at least 7 hex characters of the approved main commit."
          case "$GITHUB_SHA" in "$commit"*) ;; *) fail "main is at $GITHUB_SHA, not the approved commit $commit. Nothing was built." ;; esac
          echo "Publishing request matches: version $version, commit $GITHUB_SHA."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check the signing setup exists
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FINGERPRINT: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing ANDROID_KEYSTORE_BASE64(secret)"
          [ -n "$PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD(secret)"
          [ -n "$FINGERPRINT" ] || missing="$missing ANDROID_SIGNING_CERT_SHA256(variable)"
          if [ -n "$missing" ]; then echo "::error::Signing is not set up. Missing:$missing. See docs/ANDROID.md."; exit 1; fi

      # Opens the keystore before anything is built and says exactly what is wrong, without
      # printing any secret: only the file size, the names of the keys and public fingerprints.
      - name: Check the signing key can be used
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FINGERPRINT: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || 'deliordernyc' }}
        run: |
          KS="$RUNNER_TEMP/check.p12"
          trap 'rm -f "$KS" list.txt err.txt' EXIT
          fail() { echo "::error::$1"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$KS" 2>/dev/null \
            || fail "ANDROID_KEYSTORE_BASE64 is not valid base64 text. Copy the whole content of the -base64.txt file again."
          echo "Keystore file decoded: $(stat -c %s "$KS") bytes."
          if ! keytool -list -keystore "$KS" -storepass:env KS_PASSWORD > list.txt 2> err.txt; then
            reason="$(cat list.txt err.txt | grep -v '^Picked up' | grep -m1 -i 'error' | head -c 200)"
            if printf '%s' "$reason" | grep -qi 'password'; then
              fail "ANDROID_KEYSTORE_PASSWORD does not open the keystore ($reason). Re-enter the password secret, with no spaces before or after."
            fi
            fail "The keystore file is damaged or incomplete ($reason). The ANDROID_KEYSTORE_BASE64 secret was probably not copied completely."
          fi
          aliases="$(grep -i 'PrivateKeyEntry' list.txt | cut -d, -f1 | tr '\n' ' ')"
          echo "Keys found in the keystore: ${aliases:-none}"
          [ -n "$aliases" ] || fail "The keystore contains no private key."
          wanted="$(printf '%s' "$KEY_ALIAS" | tr 'A-Z' 'a-z')"
          printf '%s\n' $aliases | grep -qx "$wanted" \
            || fail "There is no key named '$KEY_ALIAS'. Add the repository variable ANDROID_KEY_ALIAS with one of: $aliases"
          keytool -certreq -alias "$wanted" -keystore "$KS" -storepass:env KS_PASSWORD -keypass:env KS_PASSWORD > /dev/null 2>&1 \
            || fail "The key '$wanted' has a different password from the keystore. Create the key again with one password (docs/ANDROID.md)."
          actual="$(keytool -list -v -alias "$wanted" -keystore "$KS" -storepass:env KS_PASSWORD | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ': ' | tr 'A-F' 'a-f')"
          expected="$(printf '%s' "$FINGERPRINT" | sed 's/^SHA256: *//I' | tr -d ': ' | tr 'A-F' 'a-f')"
          echo "Key fingerprint (public): $actual"
          [ "$actual" = "$expected" ] \
            || fail "ANDROID_SIGNING_CERT_SHA256 does not match this key. Set the variable to the fingerprint shown above if this is your key."
          echo "Signing key OK."

      - name: Install dependencies
        run: npm ci

      - name: Version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Android identity and version consistency
        run: node scripts/check-android-identity.mjs "v${{ steps.version.outputs.version }}"

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build the web app and scan it for secrets
        run: npm run build
        env:
          SECRET_SCAN_CANARY: ci-canary-not-a-real-key-d05c6e

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Build the signed APK and run Android lint
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          DELI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DELI_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DELI_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || 'deliordernyc' }}
        run: |
          export DELI_KEYSTORE_FILE="$RUNNER_TEMP/deliordernyc-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$DELI_KEYSTORE_FILE"
          trap 'rm -f "$DELI_KEYSTORE_FILE"' EXIT
          ./gradlew --no-daemon assembleRelease lintRelease

      - name: Verify signature, identity and contents
        env:
          FINGERPRINT: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --print-certs "$APK" > certs.txt
          # apksigner prints "Signer #1 certificate SHA-256 digest: <hex>" (older) or
          # "Signer #1: certificate SHA-256 digest: <hex>" (newer); take the hex after the label.
          actual="$(grep -m1 -i 'certificate SHA-256 digest:' certs.txt | sed -E 's/.*certificate SHA-256 digest:[[:space:]]*//I' | tr -d ': \r' | tr 'A-F' 'a-f')"
          expected="$(printf '%s' "$FINGERPRINT" | sed 's/^SHA256: *//I' | tr -d ': ' | tr 'A-F' 'a-f')"
          printf '%s' "$actual" | grep -Eqx '[0-9a-f]{64}' \
            || { echo "::error::Could not read the APK's certificate fingerprint from apksigner (got '$actual')."; exit 1; }
          printf '%s' "$expected" | grep -Eqx '[0-9a-f]{64}' \
            || { echo "::error::ANDROID_SIGNING_CERT_SHA256 is not a 64-character SHA-256 fingerprint."; exit 1; }
          if [ "$actual" != "$expected" ]; then echo "::error::The APK is not signed with the registered key (got $actual)."; exit 1; fi
          echo "APK signed with the registered key: $actual"
          "$TOOLS/aapt2" dump badging "$APK" > badging.txt
          node scripts/check-android-identity.mjs "v$VERSION" badging.txt
          unzip -l "$APK" | grep -q 'assets/public/index.html'
          mkdir -p out
          cp "$APK" "out/DeliOrderNYC-$VERSION.apk"
          (cd out && sha256sum "DeliOrderNYC-$VERSION.apk" | tee "DeliOrderNYC-$VERSION.apk.sha256")

      - name: Upload the APK for review
        uses: actions/upload-artifact@v4
        with:
          name: DeliOrderNYC-${{ steps.version.outputs.version }}
          path: out/
          retention-days: 14

  draft-release:
    name: Attach to a draft GitHub Release (not published)
    needs: build
    if: inputs.create_draft_release && !inputs.publish_approved_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the verified APK
        uses: actions/download-artifact@v4
        with:
          name: DeliOrderNYC-${{ needs.build.outputs.version }}
          path: out

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Raise the version in package.json first."; exit 1
          fi
          printf '%s\n' "${NOTES:-DeliOrderNYC $VERSION}" > notes.txt
          gh release create "$TAG" "out/DeliOrderNYC-$VERSION.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DeliOrderNYC $VERSION" --notes-file notes.txt --draft
          echo "Draft release $TAG created. It is NOT visible to the app until you publish it on GitHub."

  publish-release:
    name: Publish the approved release (latest, stable)
    needs: build
    if: inputs.publish_approved_release
    runs-on: ubuntu-latest
    # The owner can add "Required reviewers" to this environment (Settings → Environments) for an
    # extra approval click; without it, starting this run with the approved commit is the approval.
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      # The full CI (browser tests on phone sizes, the Android build check, Pages check) must have
      # passed on exactly this commit. Waits for it if it is still running; anything else stops here.
      - name: Require a green CI run on the approved commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" --jq '.workflow_runs[0] | "\(.status) \(.conclusion) \(.html_url)"')"
            set -- $run
            if [ "$1" = "completed" ]; then
              [ "$2" = "success" ] && { echo "CI passed on $GITHUB_SHA: $3"; exit 0; }
              echo "::error::CI did not pass on $GITHUB_SHA ($2): $3. Nothing was published."; exit 1
            fi
            echo "CI on $GITHUB_SHA: ${1:-not started}; waiting…"
            sleep 30
          done
          echo "::error::CI on $GITHUB_SHA did not finish in 30 minutes. Nothing was published."; exit 1

      - name: Download the verified APK
        uses: actions/download-artifact@v4
        with:
          name: DeliOrderNYC-${{ needs.build.outputs.version }}
          path: out

      - name: Check the APK is the one that was verified
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd out
          sha256sum -c "DeliOrderNYC-$VERSION.apk.sha256"

      - name: Publish (or finish this version's own draft); never a second release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          TAG="v$VERSION"
          APK="out/DeliOrderNYC-$VERSION.apk"
          printf '%s\n' "${NOTES:-DeliOrderNYC $VERSION}" > notes.txt
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$TAG\")]")"
          count="$(printf '%s' "$existing" | jq length)"
          [ "$count" -le 1 ] || { echo "::error::There are $count releases for $TAG. Remove the extra drafts first."; exit 1; }
          if [ "$count" = "1" ]; then
            [ "$(printf '%s' "$existing" | jq -r '.[0].draft')" = "true" ] \
              || { echo "::error::$TAG is already published. Raise the version for a new release."; exit 1; }
            id="$(printf '%s' "$existing" | jq -r '.[0].id')"
            echo "Finishing this version's draft ($id) with the verified APK."
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="DeliOrderNYC $VERSION" \
              -f body="$(cat notes.txt)" -F draft=false -F prerelease=false -f make_latest=true > /dev/null
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "DeliOrderNYC $VERSION" --notes-file notes.txt --latest
          fi

      - name: Confirm what the app will see
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="v$VERSION"
          NAME="DeliOrderNYC-$VERSION.apk"
          SHA="$(cut -d' ' -f1 "out/$NAME.sha256")"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$NAME"
          for attempt in 1 2 3 4 5 6; do
            latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")"
            ok="$(printf '%s' "$latest" | jq -r --arg tag "$TAG" --arg name "$NAME" --arg url "$URL" --arg sha "sha256:$SHA" \
              '.tag_name == $tag and (.draft | not) and (.prerelease | not) and ([.assets[] | select(.name == $name and .browser_download_url == $url and .state == "uploaded" and .digest == $sha)] | length == 1)')"
            if [ "$ok" = "true" ]; then
              echo "The latest release is $TAG with $NAME (sha256 $SHA)."
              echo "Published: $(printf '%s' "$latest" | jq -r .html_url)"
              echo "### Published $TAG: $(printf '%s' "$latest" | jq -r .html_url)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The latest-release API does not show $TAG with the verified APK. Check the release page."
          printf '%s' "$latest" | jq '{tag_name, draft, prerelease, assets: [.assets[] | {name, state, digest, browser_download_url}]}'
          exit 1
