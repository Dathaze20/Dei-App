name: Deploy to GitHub Pages (manual)

# Publishes the reviewed `main` branch to https://dathaze20.github.io/Dei-App/ for testing on a
# phone. It runs ONLY when someone presses "Run workflow" in the Actions tab: never on push,
# pull request or schedule. Runs started from any branch other than main are refused.
# Setup and safety notes: docs/GITHUB_PAGES.md
on:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a run in progress is never cancelled half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build main for /Dei-App/
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Only the Pages build gets the /Dei-App/ base path; local, test and CI builds are unchanged.
      - name: Build for GitHub Pages
        run: npx vite build --base=/Dei-App/

      - name: Scan the bundle for secrets
        run: npm run check:secrets
        env:
          SECRET_SCAN_CANARY: ci-canary-not-a-real-key-d05c6e

      - name: Check every asset is served under /Dei-App/
        run: node scripts/check-pages-build.mjs dist /Dei-App/

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
