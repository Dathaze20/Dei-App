name: CI

# Type-checks, tests and builds the web app on every push and pull request.
# It only verifies; it never deploys, publishes a release or signs anything.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The build ends with a scan of dist/ for credentials (scripts/check-bundle-secrets.mjs).
      # Fake "secret" values are set here on purpose: if any build setting ever copied these
      # variables into the browser bundle, the scan would find them and fail the build.
      - name: Build and scan the bundle for secrets
        run: npm run build
        env:
          GEMINI_API_KEY: ci-canary-not-a-real-key-7f3a9c
          API_KEY: ci-canary-not-a-real-key-2b8e41
          SECRET_SCAN_CANARY: ci-canary-not-a-real-key-d05c6e

  e2e:
    name: Browser tests (Galaxy A17 viewport)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  pages-build:
    name: GitHub Pages build check (no deployment)
    # Builds the site exactly as the manual Pages workflow would (base /Dei-App/) and opens it in
    # Chromium with the internet blocked. It never uploads or publishes anything.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build for GitHub Pages
        run: npx vite build --base=/Dei-App/

      - name: Scan the bundle for secrets
        run: npm run check:secrets

      - name: Check every asset is served under /Dei-App/
        run: node scripts/check-pages-build.mjs dist /Dei-App/

      - name: Open it under /Dei-App/ with the internet blocked
        run: |
          npx vite preview --base=/Dei-App/ --port 4190 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4190/Dei-App/ > /dev/null && break; sleep 1; done
          node scripts/smoke-pages.mjs http://localhost:4190/Dei-App/

  android:
    name: Android build check (unsigned, nothing published)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Android identity and version consistency
        run: npm run check:android

      - name: Build the web app and scan it for secrets
        run: npm run build
        env:
          GEMINI_API_KEY: ci-canary-not-a-real-key-7f3a9c
          API_KEY: ci-canary-not-a-real-key-2b8e41
          SECRET_SCAN_CANARY: ci-canary-not-a-real-key-d05c6e

      - name: Copy the web app into the Android project
        run: npx cap sync android

      # No signing key exists in CI: this produces an unsigned APK that cannot be installed.
      - name: Gradle build and Android lint
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease lintRelease

      - name: Check the built APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          "$AAPT2" dump badging "$APK" > badging.txt
          head -3 badging.txt
          node scripts/check-android-identity.mjs "v$(node -p "require('./package.json').version")" badging.txt
          # The app, its styles and fonts are inside the APK; nothing is loaded from a web address.
          unzip -l "$APK" | grep -q 'assets/public/index.html'
          unzip -l "$APK" | grep -q 'assets/public/assets/.*\.css'
          unzip -l "$APK" | grep -q 'assets/public/assets/.*\.woff2'
          unzip -p "$APK" assets/capacitor.config.json | node -e "const c=JSON.parse(require('fs').readFileSync(0,'utf8')); if (c.server?.url) { console.error('server.url is set'); process.exit(1) } console.log('Bundled, origin', c.server.androidScheme + '://' + c.server.hostname)"

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: Visual comparison with main (Galaxy A17 viewport)
    # Photographs the existing screens built from main and from this branch and reports how many
    # pixels differ. It reports only; a person reviews the side-by-side images in the artifact.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build this branch (after)
        run: npm run build

      - name: Build main (before)
        run: |
          git worktree add ../baseline origin/main
          cd ../baseline
          npm ci
          npx vite build --outDir "$GITHUB_WORKSPACE/baseline-dist" --emptyOutDir

      - name: Screenshots of main
        run: npx playwright test -c playwright.visual.config.ts
        env:
          VISUAL_DIST: baseline-dist
          VISUAL_LABEL: before

      - name: Screenshots of this branch
        run: npx playwright test -c playwright.visual.config.ts
        env:
          VISUAL_DIST: dist
          VISUAL_LABEL: after

      # This branch again, but with Inter from Google Fonts as main loads it, so the report can
      # tell font-file differences apart from CSS differences.
      - name: Screenshots of this branch with Google Fonts
        run: |
          node visual/googlefonts-variant.mjs dist dist-googlefonts
          npx playwright test -c playwright.visual.config.ts
        env:
          VISUAL_DIST: dist-googlefonts
          VISUAL_LABEL: after-googlefonts

      - name: Compare
        run: node visual/compare.mjs visual-output

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-comparison
          path: visual-output/
          retention-days: 30
